name: Build Launcher Le Eaglercraft EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-windows:
    name: Build Windows EXE
    runs-on: windows-latest

    steps:

      # ============================================================
      # 1. Checkout YOUR launcher repository
      # ============================================================
      - name: Checkout Launcher Le Eaglercraft
        uses: actions/checkout@v4
        with:
          path: launcher

      # ============================================================
      # 2. Install .NET 8
      # ============================================================
      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # ============================================================
      # 3. Create build directories
      # ============================================================
      - name: Create build directories
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path "build"
          New-Item -ItemType Directory -Force -Path "build\launcher"
          New-Item -ItemType Directory -Force -Path "build\games"
          New-Item -ItemType Directory -Force -Path "desktop"
          New-Item -ItemType Directory -Force -Path "dist"

      # ============================================================
      # 4. Copy EVERYTHING from your launcher repository
      #
      # Uses the actual files already in launcher-le-eaglercraft.
      #
      # Robocopy exit codes 0-7 are successful/status results.
      # Only 8+ means an actual copy failure.
      # ============================================================
      - name: Copy existing launcher
        shell: powershell
        run: |
          robocopy "launcher" "build\launcher" /E /XD ".git" ".github" /XF ".gitignore"

          $code = $LASTEXITCODE

          Write-Host "Robocopy exit code: $code"

          if ($code -le 7) {
            exit 0
          }

          Write-Error "Robocopy failed with exit code $code"
          exit $code

      # ============================================================
      # 5. Download secret-stuff-
      # ============================================================
      - name: Download secret-stuff-
        shell: powershell
        run: |
          git clone --depth 1 `
            "https://github.com/Vexo-Sirramenboi/secret-stuff-.git" `
            "build\games\secret-stuff-"

      # ============================================================
      # 6. Download secret-stuff-v2
      # ============================================================
      - name: Download secret-stuff-v2
        shell: powershell
        run: |
          git clone --depth 1 `
            "https://github.com/Vexo-Sirramenboi/secret-stuff-v2.git" `
            "build\games\secret-stuff-v2"

      # ============================================================
      # 7. Download secret-stuff-v3
      # ============================================================
      - name: Download secret-stuff-v3
        shell: powershell
        run: |
          git clone --depth 1 `
            "https://github.com/Vexo-Sirramenboi/secret-stuff-v3.git" `
            "build\games\secret-stuff-v3"

      # ============================================================
      # 8. Download secret-stuff-v4
      # ============================================================
      - name: Download secret-stuff-v4
        shell: powershell
        run: |
          git clone --depth 1 `
            "https://github.com/Vexo-Sirramenboi/secret-stuff-v4.git" `
            "build\games\secret-stuff-v4"

      # ============================================================
      # 9. Download secret-stuff-v5
      # ============================================================
      - name: Download secret-stuff-v5
        shell: powershell
        run: |
          git clone --depth 1 `
            "https://github.com/Vexo-Sirramenboi/secret-stuff-v5.git" `
            "build\games\secret-stuff-v5"

      # ============================================================
      # 10. Download secret-stuff-v6
      # ============================================================
      - name: Download secret-stuff-v6
        shell: powershell
        run: |
          git clone --depth 1 `
            "https://github.com/Vexo-Sirramenboi/secret-stuff-v6.git" `
            "build\games\secret-stuff-v6"

      # ============================================================
      # 11. Download secret-stuff-v7
      # ============================================================
      - name: Download secret-stuff-v7
        shell: powershell
        run: |
          git clone --depth 1 `
            "https://github.com/Vexo-Sirramenboi/secret-stuff-v7.git" `
            "build\games\secret-stuff-v7"

      # ============================================================
      # 12. Download secret-stuff-v8
      # ============================================================
      - name: Download secret-stuff-v8
        shell: powershell
        run: |
          git clone --depth 1 `
            "https://github.com/Vexo-Sirramenboi/secret-stuff-v8.git" `
            "build\games\secret-stuff-v8"

      # ============================================================
      # 13. Download secret-stuff-v9
      # ============================================================
      - name: Download secret-stuff-v9
        shell: powershell
        run: |
          git clone --depth 1 `
            "https://github.com/Vexo-Sirramenboi/secret-stuff-v9.git" `
            "build\games\secret-stuff-v9"

      # ============================================================
      # 14. Download secret-stuff-v10
      # ============================================================
      - name: Download secret-stuff-v10
        shell: powershell
        run: |
          git clone --depth 1 `
            "https://github.com/Vexo-Sirramenboi/secret-stuff-v10.git" `
            "build\games\secret-stuff-v10"

      # ============================================================
      # 15. Download secret-stuff-v11
      # ============================================================
      - name: Download secret-stuff-v11
        shell: powershell
        run: |
          git clone --depth 1 `
            "https://github.com/Vexo-Sirramenboi/secret-stuff-v11.git" `
            "build\games\secret-stuff-v11"

      # ============================================================
      # 16. Download secret-stuff-v12
      # ============================================================
      - name: Download secret-stuff-v12
        shell: powershell
        run: |
          git clone --depth 1 `
            "https://github.com/Vexo-Sirramenboi/secret-stuff-v12.git" `
            "build\games\secret-stuff-v12"

      # ============================================================
      # 17. Download secret-stuff-v13
      # ============================================================
      - name: Download secret-stuff-v13
        shell: powershell
        run: |
          git clone --depth 1 `
            "https://github.com/Vexo-Sirramenboi/secret-stuff-v13.git" `
            "build\games\secret-stuff-v13"

      # ============================================================
      # 18. Remove Git metadata
      # ============================================================
      - name: Remove Git metadata
        shell: powershell
        run: |
          Get-ChildItem "build" -Directory -Recurse -Force |
            Where-Object { $_.Name -eq ".git" } |
            Remove-Item -Recurse -Force

      # ============================================================
      # 19. Verify all 13 repositories
      # ============================================================
      - name: Verify downloaded repositories
        shell: powershell
        run: |
          $repos = @(
            "secret-stuff-",
            "secret-stuff-v2",
            "secret-stuff-v3",
            "secret-stuff-v4",
            "secret-stuff-v5",
            "secret-stuff-v6",
            "secret-stuff-v7",
            "secret-stuff-v8",
            "secret-stuff-v9",
            "secret-stuff-v10",
            "secret-stuff-v11",
            "secret-stuff-v12",
            "secret-stuff-v13"
          )

          foreach ($repo in $repos) {
            $path = "build\games\$repo"

            if (-not (Test-Path $path)) {
              Write-Error "Missing repository: $repo"
              exit 1
            }

            Write-Host "Found: $repo"
          }

          Write-Host ""
          Write-Host "All 13 repositories downloaded successfully."

      # ============================================================
      # 20. Prepare desktop launcher
      #
      # This modifies ONLY the BUILD COPY of index.html.
      # Your actual GitHub file is not changed.
      #
      # Online GitHub Pages URLs are changed to local /games/ paths.
      # ============================================================
      - name: Prepare desktop launcher
        shell: powershell
        run: |
          $index = "build\launcher\index.html"

          if (-not (Test-Path $index)) {
            Write-Error "index.html was not found."
            exit 1
          }

          $html = Get-Content $index -Raw

          $replacements = @{
            "https://vexo-sirramenboi.github.io/secret-stuff-v10/" = "/games/secret-stuff-v10/"
            "https://Vexo-Sirramenboi.github.io/secret-stuff-v10/" = "/games/secret-stuff-v10/"

            "https://vexo-sirramenboi.github.io/secret-stuff-v11/" = "/games/secret-stuff-v11/"
            "https://Vexo-Sirramenboi.github.io/secret-stuff-v11/" = "/games/secret-stuff-v11/"

            "https://vexo-sirramenboi.github.io/secret-stuff-v12/" = "/games/secret-stuff-v12/"
            "https://Vexo-Sirramenboi.github.io/secret-stuff-v12/" = "/games/secret-stuff-v12/"

            "https://vexo-sirramenboi.github.io/secret-stuff-v13/" = "/games/secret-stuff-v13/"
            "https://Vexo-Sirramenboi.github.io/secret-stuff-v13/" = "/games/secret-stuff-v13/"

            "https://vexo-sirramenboi.github.io/secret-stuff/" = "/games/secret-stuff-/"
            "https://Vexo-Sirramenboi.github.io/secret-stuff/" = "/games/secret-stuff-/"

            "https://vexo-sirramenboi.github.io/secret-stuff-v6/" = "/games/secret-stuff-v6/"
            "https://Vexo-Sirramenboi.github.io/secret-stuff-v6/" = "/games/secret-stuff-v6/"

            "https://vexo-sirramenboi.github.io/secret-stuff-v4/" = "/games/secret-stuff-v4/"
            "https://Vexo-Sirramenboi.github.io/secret-stuff-v4/" = "/games/secret-stuff-v4/"

            "https://vexo-sirramenboi.github.io/secret-stuff-v7/" = "/games/secret-stuff-v7/"
            "https://Vexo-Sirramenboi.github.io/secret-stuff-v7/" = "/games/secret-stuff-v7/"

            "https://vexo-sirramenboi.github.io/secret-stuff-v5/" = "/games/secret-stuff-v5/"
            "https://Vexo-Sirramenboi.github.io/secret-stuff-v5/" = "/games/secret-stuff-v5/"

            "https://vexo-sirramenboi.github.io/secret-stuff-v3/" = "/games/secret-stuff-v3/"
            "https://Vexo-Sirramenboi.github.io/secret-stuff-v3/" = "/games/secret-stuff-v3/"

            "https://vexo-sirramenboi.github.io/secret-stuff-v8" = "/games/secret-stuff-v8/"
          }

          foreach ($old in $replacements.Keys) {
            $html = $html.Replace(
              $old,
              $replacements[$old]
            )
          }

          Set-Content `
            -Path $index `
            -Value $html `
            -Encoding UTF8

          Write-Host "Desktop launcher prepared."

      # ============================================================
      # 21. Create .NET desktop project
      # ============================================================
      - name: Create desktop project
        shell: powershell
        run: |
          @'
          <Project Sdk="Microsoft.NET.Sdk">

            <PropertyGroup>
              <OutputType>WinExe</OutputType>
              <TargetFramework>net8.0-windows</TargetFramework>
              <UseWindowsForms>true</UseWindowsForms>

              <RuntimeIdentifier>win-x64</RuntimeIdentifier>
              <SelfContained>true</SelfContained>

              <PublishSingleFile>true</PublishSingleFile>
              <IncludeNativeLibrariesForSelfExtract>true</IncludeNativeLibrariesForSelfExtract>

              <AssemblyName>Launcher-Le-Eaglercraft</AssemblyName>
              <RootNamespace>LauncherLeEaglercraft</RootNamespace>

              <EnableDefaultApplicationIcon>false</EnableDefaultApplicationIcon>
            </PropertyGroup>

            <ItemGroup>
              <PackageReference Include="Microsoft.Web.WebView2" Version="1.0.3485.11" />
              <EmbeddedResource Include="launcher.zip" />
            </ItemGroup>

          </Project>
          '@ | Set-Content "desktop\Launcher-Le-Eaglercraft.csproj"

      # ============================================================
      # 22. Package launcher + all 13 repositories
      # ============================================================
      - name: Package launcher resources
        shell: powershell
        run: |
          Compress-Archive `
            -Path "build\launcher", "build\games" `
            -DestinationPath "desktop\launcher.zip" `
            -CompressionLevel Optimal

          if (-not (Test-Path "desktop\launcher.zip")) {
            Write-Error "launcher.zip was not created."
            exit 1
          }

          $size = (Get-Item "desktop\launcher.zip").Length

          Write-Host "Embedded launcher package size: $size bytes"

      # ============================================================
      # 23. Create desktop launcher source
      # ============================================================
      - name: Create desktop launcher source
        shell: powershell
        run: |
          @'
          using System;
          using System.IO;
          using System.IO.Compression;
          using System.Reflection;
          using System.Windows.Forms;
          using Microsoft.Web.WebView2.Core;
          using Microsoft.Web.WebView2.WinForms;

          namespace LauncherLeEaglercraft
          {
              internal static class Program
              {
                  [STAThread]
                  static void Main()
                  {
                      ApplicationConfiguration.Initialize();

                      string appDirectory = Path.Combine(
                          Environment.GetFolderPath(
                              Environment.SpecialFolder.LocalApplicationData
                          ),
                          "Launcher Le Eaglercraft"
                      );

                      string launcherDirectory =
                          Path.Combine(appDirectory, "launcher");

                      Directory.CreateDirectory(appDirectory);

                      try
                      {
                          ExtractLauncher(launcherDirectory);

                          Application.Run(
                              new LauncherForm(
                                  launcherDirectory
                              )
                          );
                      }
                      catch (Exception ex)
                      {
                          MessageBox.Show(
                              ex.ToString(),
                              "Launcher Le Eaglercraft",
                              MessageBoxButtons.OK,
                              MessageBoxIcon.Error
                          );
                      }
                  }

                  static void ExtractLauncher(
                      string destination
                  )
                  {
                      Assembly assembly =
                          Assembly.GetExecutingAssembly();

                      using Stream? resource =
                          assembly.GetManifestResourceStream(
                              "LauncherLeEaglercraft.launcher.zip"
                          );

                      if (resource == null)
                      {
                          throw new Exception(
                              "Embedded launcher resources were not found."
                          );
                      }

                      string temporaryZip =
                          Path.Combine(
                              Path.GetTempPath(),
                              "launcher-le-eaglercraft.zip"
                          );

                      using (
                          FileStream output =
                              new FileStream(
                                  temporaryZip,
                                  FileMode.Create,
                                  FileAccess.Write
                              )
                      )
                      {
                          resource.CopyTo(output);
                      }

                      if (Directory.Exists(destination))
                      {
                          Directory.Delete(
                              destination,
                              true
                          );
                      }

                      Directory.CreateDirectory(
                          destination
                      );

                      ZipFile.ExtractToDirectory(
                          temporaryZip,
                          destination
                      );

                      File.Delete(
                          temporaryZip
                      );
                  }
              }

              public sealed class LauncherForm : Form
              {
                  private readonly WebView2 webView;

                  public LauncherForm(
                      string launcherDirectory
                  )
                  {
                      Text =
                          "Launcher Le Eaglercraft";

                      Width = 1280;
                      Height = 800;

                      MinimumSize =
                          new System.Drawing.Size(
                              900,
                              600
                          );

                      StartPosition =
                          FormStartPosition.CenterScreen;

                      webView =
                          new WebView2
                          {
                              Dock = DockStyle.Fill
                          };

                      Controls.Add(webView);

                      Load += async (_, _) =>
                      {
                          await InitializeBrowser(
                              launcherDirectory
                          );
                      };
                  }

                  private async Task InitializeBrowser(
                      string launcherDirectory
                  )
                  {
                      await webView.EnsureCoreWebView2Async();

                      webView.CoreWebView2.SetVirtualHostNameToFolderMapping(
                          "launcher.local",
                          launcherDirectory,
                          CoreWebView2HostResourceAccessKind.Allow
                      );

                      webView.CoreWebView2.Navigate(
                          "https://launcher.local/index.html"
                      );
                  }
              }
          }
          '@ | Set-Content "desktop\Program.cs"

      # ============================================================
      # 24. Build the SINGLE Windows EXE
      # ============================================================
      - name: Build single-file EXE
        shell: powershell
        run: |
          dotnet publish `
            "desktop\Launcher-Le-Eaglercraft.csproj" `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            --output "dist"

      # ============================================================
      # 25. Verify EXE
      # ============================================================
      - name: Verify EXE
        shell: powershell
        run: |
          $exe = "dist\Launcher-Le-Eaglercraft.exe"

          if (-not (Test-Path $exe)) {
            Write-Error "Launcher-Le-Eaglercraft.exe was not created."
            exit 1
          }

          $file = Get-Item $exe

          Write-Host ""
          Write-Host "============================================"
          Write-Host " BUILD SUCCESSFUL"
          Write-Host "============================================"
          Write-Host "Name: $($file.Name)"
          Write-Host "Size: $($file.Length) bytes"
          Write-Host "Path: $($file.FullName)"
          Write-Host "============================================"
          Write-Host ""

      # ============================================================
      # 26. Upload ONLY the EXE
      # ============================================================
      - name: Upload Launcher EXE
        uses: actions/upload-artifact@v4
        with:
          name: Launcher-Le-Eaglercraft-Windows
          path: dist\Launcher-Le-Eaglercraft.exe
          if-no-files-found: error
          retention-days: 30
