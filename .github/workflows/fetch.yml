name: Build Launcher EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout launcher repository
        uses: actions/checkout@v4
        with:
          path: launcher-repo

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Create build directories
        shell: pwsh
        run: |
          $root = "${{ github.workspace }}"

          New-Item -ItemType Directory -Force -Path "$root\build" | Out-Null
          New-Item -ItemType Directory -Force -Path "$root\build\website" | Out-Null
          New-Item -ItemType Directory -Force -Path "$root\build\repos" | Out-Null
          New-Item -ItemType Directory -Force -Path "$root\build\desktop" | Out-Null
          New-Item -ItemType Directory -Force -Path "$root\build\cef-publish" | Out-Null
          New-Item -ItemType Directory -Force -Path "$root\build\bootstrap" | Out-Null

      - name: Copy launcher website
        shell: pwsh
        run: |
          $root = "${{ github.workspace }}"
          $source = "$root\launcher-repo"
          $destination = "$root\build\website"

          Write-Host "Launcher source: $source"
          Write-Host "Website destination: $destination"

          Get-ChildItem -Force $source | ForEach-Object {
            if ($_.Name -ne ".git") {
              Copy-Item $_.FullName $destination -Recurse -Force
            }
          }

          if (!(Test-Path "$destination\index.html")) {
            Write-Error "index.html was not found in the launcher repository root."
            Get-ChildItem -Force $source
            exit 1
          }

          Write-Host "Launcher website copied successfully."

      - name: Checkout secret-stuff
        uses: actions/checkout@v4
        with:
          repository: Vexo-Sirramenboi/secret-stuff
          path: build/repos/secret-stuff

      - name: Checkout secret-stuff-v2
        uses: actions/checkout@v4
        with:
          repository: Vexo-Sirramenboi/secret-stuff-v2
          path: build/repos/secret-stuff-v2

      - name: Checkout secret-stuff-v3
        uses: actions/checkout@v4
        with:
          repository: Vexo-Sirramenboi/secret-stuff-v3
          path: build/repos/secret-stuff-v3

      - name: Checkout secret-stuff-v4
        uses: actions/checkout@v4
        with:
          repository: Vexo-Sirramenboi/secret-stuff-v4
          path: build/repos/secret-stuff-v4

      - name: Checkout secret-stuff-v5
        uses: actions/checkout@v4
        with:
          repository: Vexo-Sirramenboi/secret-stuff-v5
          path: build/repos/secret-stuff-v5

      - name: Checkout secret-stuff-v6
        uses: actions/checkout@v4
        with:
          repository: Vexo-Sirramenboi/secret-stuff-v6
          path: build/repos/secret-stuff-v6

      - name: Checkout secret-stuff-v7
        uses: actions/checkout@v4
        with:
          repository: Vexo-Sirramenboi/secret-stuff-v7
          path: build/repos/secret-stuff-v7

      - name: Checkout secret-stuff-v8
        uses: actions/checkout@v4
        with:
          repository: Vexo-Sirramenboi/secret-stuff-v8
          path: build/repos/secret-stuff-v8

      - name: Checkout secret-stuff-v9
        uses: actions/checkout@v4
        with:
          repository: Vexo-Sirramenboi/secret-stuff-v9
          path: build/repos/secret-stuff-v9

      - name: Checkout secret-stuff-v10
        uses: actions/checkout@v4
        with:
          repository: Vexo-Sirramenboi/secret-stuff-v10
          path: build/repos/secret-stuff-v10

      - name: Checkout secret-stuff-v11
        uses: actions/checkout@v4
        with:
          repository: Vexo-Sirramenboi/secret-stuff-v11
          path: build/repos/secret-stuff-v11

      - name: Checkout secret-stuff-v12
        uses: actions/checkout@v4
        with:
          repository: Vexo-Sirramenboi/secret-stuff-v12
          path: build/repos/secret-stuff-v12

      - name: Checkout secret-stuff-v13
        uses: actions/checkout@v4
        with:
          repository: Vexo-Sirramenboi/secret-stuff-v13
          path: build/repos/secret-stuff-v13

      - name: Remove repository metadata
        shell: pwsh
        run: |
          $root = "${{ github.workspace }}\build\repos"

          Get-ChildItem $root -Directory -Force | ForEach-Object {
            $git = Join-Path $_.FullName ".git"

            if (Test-Path $git) {
              Remove-Item $git -Recurse -Force
            }
          }

      - name: Copy game repositories into launcher
        shell: pwsh
        run: |
          $root = "${{ github.workspace }}"
          $website = "$root\build\website"
          $repos = "$root\build\repos"

          $games = @(
            "secret-stuff",
            "secret-stuff-v2",
            "secret-stuff-v3",
            "secret-stuff-v4",
            "secret-stuff-v5",
            "secret-stuff-v6",
            "secret-stuff-v7",
            "secret-stuff-v8",
            "secret-stuff-v9",
            "secret-stuff-v10",
            "secret-stuff-v11",
            "secret-stuff-v12",
            "secret-stuff-v13"
          )

          foreach ($game in $games) {
            $source = "$repos\$game"
            $destination = "$website\$game"

            Write-Host "Copying $game"

            New-Item -ItemType Directory -Force -Path $destination | Out-Null

            Get-ChildItem -Force $source | ForEach-Object {
              if ($_.Name -ne ".git") {
                Copy-Item $_.FullName $destination -Recurse -Force
              }
            }
          }

          Write-Host "All 13 game repositories copied."

      - name: Create CefSharp launcher project
        shell: pwsh
        run: |
          $root = "${{ github.workspace }}"
          $desktop = "$root\build\desktop"

          @'
          <Project Sdk="Microsoft.NET.Sdk">

            <PropertyGroup>
              <OutputType>WinExe</OutputType>
              <TargetFramework>net8.0-windows</TargetFramework>
              <UseWindowsForms>true</UseWindowsForms>
              <Nullable>enable</Nullable>
              <ImplicitUsings>enable</ImplicitUsings>
              <Platforms>x64</Platforms>
              <PlatformTarget>x64</PlatformTarget>
              <AssemblyName>Launcher-Le-Eaglercraft</AssemblyName>
              <RootNamespace>LauncherLeEaglercraft</RootNamespace>
            </PropertyGroup>

            <ItemGroup>
              <PackageReference Include="CefSharp.WinForms.NETCore" Version="144.0.270" />
            </ItemGroup>

          </Project>
          '@ | Set-Content "$desktop\Launcher-Le-Eaglercraft.csproj" -Encoding UTF8

      - name: Create CefSharp Program.cs
        shell: pwsh
        run: |
          $root = "${{ github.workspace }}"
          $desktop = "$root\build\desktop"

          @'
          using System;
          using System.IO;
          using System.Net;
          using System.Net.Sockets;
          using System.Text;
          using System.Threading;
          using System.Threading.Tasks;
          using System.Windows.Forms;
          using CefSharp;
          using CefSharp.WinForms;

          namespace LauncherLeEaglercraft
          {
              internal static class Program
              {
                  private static TcpListener? server;
                  private static CancellationTokenSource? serverCancellation;
                  private static string wwwRoot = "";

                  [STAThread]
                  private static void Main()
                  {
                      ApplicationConfiguration.Initialize();

                      wwwRoot = Path.Combine(
                          AppContext.BaseDirectory,
                          "www"
                      );

                      if (!File.Exists(Path.Combine(wwwRoot, "index.html")))
                      {
                          MessageBox.Show(
                              "Launcher files were not found.\n\nExpected:\n" +
                              Path.Combine(wwwRoot, "index.html"),
                              "Launcher Le Eaglercraft",
                              MessageBoxButtons.OK,
                              MessageBoxIcon.Error
                          );

                          return;
                      }

                      int port = FindFreePort();

                      serverCancellation = new CancellationTokenSource();

                      server = new TcpListener(
                          IPAddress.Loopback,
                          port
                      );

                      server.Start();

                      _ = Task.Run(
                          () => HandleServer(server, serverCancellation.Token)
                      );

                      var settings = new CefSettings();

                      settings.CachePath = Path.Combine(
                          Path.GetTempPath(),
                          "Launcher-Le-Eaglercraft-CefCache"
                      );

                      settings.LogSeverity = LogSeverity.Disable;

                      settings.CefCommandLineArgs.Add(
                          "disable-features",
                          "OutOfBlinkCors"
                      );

                      settings.CefCommandLineArgs.Add(
                          "enable-webgl"
                      );

                      settings.CefCommandLineArgs.Add(
                          "ignore-gpu-blocklist"
                      );

                      settings.CefCommandLineArgs.Add(
                          "enable-gpu"
                      );

                      settings.CefCommandLineArgs.Add(
                          "enable-media-stream"
                      );

                      Cef.Initialize(
                          settings,
                          performDependencyCheck: false,
                          browserProcessHandler: null
                      );

                      var browser = new ChromiumWebBrowser(
                          $"http://127.0.0.1:{port}/"
                      );

                      browser.Dock = DockStyle.Fill;

                      var form = new Form();

                      form.Text = "Launcher Le Eaglercraft";
                      form.Width = 1280;
                      form.Height = 800;
                      form.MinimumSize = new System.Drawing.Size(900, 600);
                      form.StartPosition = FormStartPosition.CenterScreen;

                      form.Controls.Add(browser);

                      form.FormClosed += (_, _) =>
                      {
                          StopServer();

                          try
                          {
                              Cef.Shutdown();
                          }
                          catch
                          {
                          }
                      };

                      Application.Run(form);
                  }

                  private static int FindFreePort()
                  {
                      var listener = new TcpListener(
                          IPAddress.Loopback,
                          0
                      );

                      listener.Start();

                      int port =
                          ((IPEndPoint)listener.LocalEndpoint).Port;

                      listener.Stop();

                      return port;
                  }

                  private static async Task HandleServer(
                      TcpListener listener,
                      CancellationToken cancellationToken
                  )
                  {
                      while (!cancellationToken.IsCancellationRequested)
                      {
                          TcpClient? client = null;

                          try
                          {
                              client = await listener.AcceptTcpClientAsync(
                                  cancellationToken
                              );

                              _ = Task.Run(
                                  () => HandleRequest(client),
                                  cancellationToken
                              );
                          }
                          catch
                          {
                              client?.Dispose();

                              if (cancellationToken.IsCancellationRequested)
                                  break;
                          }
                      }
                  }

                  private static async Task HandleRequest(
                      TcpClient client
                  )
                  {
                      using (client)
                      using (NetworkStream stream = client.GetStream())
                      {
                          stream.ReadTimeout = 10000;
                          stream.WriteTimeout = 10000;

                          byte[] requestBuffer = new byte[16384];

                          int bytesRead = await stream.ReadAsync(
                              requestBuffer
                          );

                          if (bytesRead <= 0)
                              return;

                          string request = Encoding.ASCII.GetString(
                              requestBuffer,
                              0,
                              bytesRead
                          );

                          string[] requestLines =
                              request.Split(
                                  "\r\n",
                                  StringSplitOptions.None
                              );

                          if (requestLines.Length == 0)
                              return;

                          string[] requestParts =
                              requestLines[0].Split(' ');

                          if (requestParts.Length < 2)
                              return;

                          string requestPath = requestParts[1];

                          int queryIndex = requestPath.IndexOf('?');

                          if (queryIndex >= 0)
                          {
                              requestPath =
                                  requestPath.Substring(0, queryIndex);
                          }

                          requestPath =
                              Uri.UnescapeDataString(requestPath);

                          if (requestPath == "/")
                              requestPath = "/index.html";

                          requestPath =
                              requestPath.TrimStart('/')
                              .Replace('/', Path.DirectorySeparatorChar);

                          string fullPath = Path.GetFullPath(
                              Path.Combine(wwwRoot, requestPath)
                          );

                          string wwwFullPath =
                              Path.GetFullPath(wwwRoot)
                              .TrimEnd(
                                  Path.DirectorySeparatorChar
                              )
                              + Path.DirectorySeparatorChar;

                          if (!fullPath.StartsWith(
                                  wwwFullPath,
                                  StringComparison.OrdinalIgnoreCase))
                          {
                              await SendResponse(
                                  stream,
                                  403,
                                  "text/plain",
                                  "Forbidden"
                              );

                              return;
                          }

                          if (!File.Exists(fullPath))
                          {
                              await SendResponse(
                                  stream,
                                  404,
                                  "text/plain",
                                  "Not Found"
                              );

                              return;
                          }

                          byte[] data =
                              await File.ReadAllBytesAsync(fullPath);

                          string contentType =
                              GetContentType(fullPath);

                          string headers =
                              "HTTP/1.1 200 OK\r\n" +
                              "Content-Type: " + contentType + "\r\n" +
                              "Content-Length: " + data.Length + "\r\n" +
                              "Cache-Control: no-cache\r\n" +
                              "Cross-Origin-Opener-Policy: same-origin\r\n" +
                              "Cross-Origin-Embedder-Policy: require-corp\r\n" +
                              "Cross-Origin-Resource-Policy: same-origin\r\n" +
                              "Access-Control-Allow-Origin: *\r\n" +
                              "Connection: close\r\n" +
                              "\r\n";

                          byte[] headerBytes =
                              Encoding.ASCII.GetBytes(headers);

                          await stream.WriteAsync(headerBytes);
                          await stream.WriteAsync(data);
                      }
                  }

                  private static string GetContentType(
                      string path
                  )
                  {
                      string extension =
                          Path.GetExtension(path)
                              .ToLowerInvariant();

                      return extension switch
                      {
                          ".html" => "text/html; charset=utf-8",
                          ".htm" => "text/html; charset=utf-8",
                          ".js" => "text/javascript; charset=utf-8",
                          ".mjs" => "text/javascript; charset=utf-8",
                          ".css" => "text/css; charset=utf-8",
                          ".json" => "application/json",
                          ".wasm" => "application/wasm",
                          ".epk" => "application/octet-stream",
                          ".epw" => "application/octet-stream",
                          ".bin" => "application/octet-stream",
                          ".data" => "application/octet-stream",
                          ".map" => "application/json",
                          ".png" => "image/png",
                          ".jpg" => "image/jpeg",
                          ".jpeg" => "image/jpeg",
                          ".gif" => "image/gif",
                          ".svg" => "image/svg+xml",
                          ".ico" => "image/x-icon",
                          ".webp" => "image/webp",
                          ".mp3" => "audio/mpeg",
                          ".wav" => "audio/wav",
                          ".ogg" => "audio/ogg",
                          ".mp4" => "video/mp4",
                          ".webm" => "video/webm",
                          ".txt" => "text/plain; charset=utf-8",
                          ".xml" => "application/xml",
                          ".zip" => "application/zip",
                          _ => "application/octet-stream"
                      };
                  }

                  private static async Task SendResponse(
                      NetworkStream stream,
                      int statusCode,
                      string contentType,
                      string text
                  )
                  {
                      byte[] body =
                          Encoding.UTF8.GetBytes(text);

                      string status =
                          statusCode == 200
                              ? "OK"
                              : statusCode == 403
                                  ? "Forbidden"
                                  : "Not Found";

                      string headers =
                          $"HTTP/1.1 {statusCode} {status}\r\n" +
                          $"Content-Type: {contentType}\r\n" +
                          $"Content-Length: {body.Length}\r\n" +
                          "Connection: close\r\n" +
                          "\r\n";

                      byte[] headerBytes =
                          Encoding.ASCII.GetBytes(headers);

                      await stream.WriteAsync(headerBytes);
                      await stream.WriteAsync(body);
                  }

                  private static void StopServer()
                  {
                      try
                      {
                          serverCancellation?.Cancel();
                      }
                      catch
                      {
                      }

                      try
                      {
                          server?.Stop();
                      }
                      catch
                      {
                      }

                      server = null;
                      serverCancellation = null;
                  }
              }
          }
          '@ | Set-Content "$desktop\Program.cs" -Encoding UTF8

      - name: Restore CefSharp
        shell: pwsh
        working-directory: build/desktop
        run: |
          dotnet restore Launcher-Le-Eaglercraft.csproj

      - name: Publish CefSharp launcher
        shell: pwsh
        working-directory: build/desktop
        run: |
          dotnet publish Launcher-Le-Eaglercraft.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=false `
            -p:IncludeNativeLibrariesForSelfExtract=false `
            -o "${{ github.workspace }}\build\cef-publish"

      - name: Assemble CEF payload
        shell: pwsh
        run: |
          $root = "${{ github.workspace }}"
          $publish = "$root\build\cef-publish"
          $website = "$root\build\website"

          if (!(Test-Path "$publish\Launcher-Le-Eaglercraft.exe")) {
            Write-Error "CefSharp launcher executable was not created."
            Get-ChildItem $publish -Recurse
            exit 1
          }

          New-Item -ItemType Directory -Force `
            -Path "$publish\www" | Out-Null

          Get-ChildItem -Force $website | ForEach-Object {
            Copy-Item `
              $_.FullName `
              "$publish\www" `
              -Recurse `
              -Force
          }

          if (!(Test-Path "$publish\www\index.html")) {
            Write-Error "Website index.html was not copied into the CefSharp payload."
            exit 1
          }

          Write-Host "CEF payload assembled successfully."

      - name: Create single EXE bootstrap project
        shell: pwsh
        run: |
          $root = "${{ github.workspace }}"
          $bootstrap = "$root\build\bootstrap"

          @'
          <Project Sdk="Microsoft.NET.Sdk">

            <PropertyGroup>
              <OutputType>WinExe</OutputType>
              <TargetFramework>net8.0-windows</TargetFramework>
              <UseWindowsForms>true</UseWindowsForms>
              <ImplicitUsings>enable</ImplicitUsings>
              <Nullable>enable</Nullable>
              <RuntimeIdentifier>win-x64</RuntimeIdentifier>
              <SelfContained>true</SelfContained>
              <PublishSingleFile>true</PublishSingleFile>
              <IncludeNativeLibrariesForSelfExtract>true</IncludeNativeLibrariesForSelfExtract>
              <EnableCompressionInSingleFile>true</EnableCompressionInSingleFile>
              <AssemblyName>Launcher-Le-Eaglercraft</AssemblyName>
              <RootNamespace>LauncherLeEaglercraftBootstrap</RootNamespace>
            </PropertyGroup>

            <ItemGroup>
              <EmbeddedResource Include="payload.zip" />
            </ItemGroup>

          </Project>
          '@ | Set-Content "$bootstrap\Launcher-Le-Eaglercraft.csproj" -Encoding UTF8

      - name: Create embedded payload
        shell: pwsh
        run: |
          $root = "${{ github.workspace }}"
          $publish = "$root\build\cef-publish"
          $bootstrap = "$root\build\bootstrap"

          if (!(Test-Path "$publish\Launcher-Le-Eaglercraft.exe")) {
            Write-Error "CefSharp executable is missing."
            exit 1
          }

          Compress-Archive `
            -Path "$publish\*" `
            -DestinationPath "$bootstrap\payload.zip" `
            -Force

          if (!(Test-Path "$bootstrap\payload.zip")) {
            Write-Error "payload.zip was not created."
            exit 1
          }

          Write-Host "Payload ZIP created."

      - name: Create bootstrap Program.cs
        shell: pwsh
        run: |
          $root = "${{ github.workspace }}"
          $bootstrap = "$root\build\bootstrap"

          @'
          using System;
          using System.IO;
          using System.IO.Compression;
          using System.Linq;
          using System.Reflection;
          using System.Diagnostics;
          using System.Windows.Forms;

          namespace LauncherLeEaglercraftBootstrap
          {
              internal static class Program
              {
                  [STAThread]
                  private static void Main()
                  {
                      try
                      {
                          string root =
                              Path.Combine(
                                  Path.GetTempPath(),
                                  "Launcher-Le-Eaglercraft",
                                  "Runtime"
                              );

                          if (Directory.Exists(root))
                          {
                              try
                              {
                                  Directory.Delete(
                                      root,
                                      true
                                  );
                              }
                              catch
                              {
                              }
                          }

                          Directory.CreateDirectory(root);

                          ExtractPayload(root);

                          string launcher =
                              Path.Combine(
                                  root,
                                  "Launcher-Le-Eaglercraft.exe"
                              );

                          if (!File.Exists(launcher))
                          {
                              throw new FileNotFoundException(
                                  "Extracted CefSharp launcher was not found.",
                                  launcher
                              );
                          }

                          var process =
                              new ProcessStartInfo
                              {
                                  FileName = launcher,
                                  WorkingDirectory = root,
                                  UseShellExecute = true
                              };

                          Process.Start(process);
                      }
                      catch (Exception ex)
                      {
                          MessageBox.Show(
                              ex.ToString(),
                              "Launcher Le Eaglercraft",
                              MessageBoxButtons.OK,
                              MessageBoxIcon.Error
                          );
                      }
                  }

                  private static void ExtractPayload(
                      string root
                  )
                  {
                      Assembly assembly =
                          Assembly.GetExecutingAssembly();

                      string? resource =
                          assembly
                              .GetManifestResourceNames()
                              .FirstOrDefault(
                                  x => x.EndsWith(
                                      "payload.zip",
                                      StringComparison.OrdinalIgnoreCase
                                  )
                              );

                      if (resource == null)
                      {
                          throw new FileNotFoundException(
                              "Embedded payload.zip was not found."
                          );
                      }

                      using Stream? stream =
                          assembly.GetManifestResourceStream(
                              resource
                          );

                      if (stream == null)
                      {
                          throw new FileNotFoundException(
                              "Could not open embedded payload.zip."
                          );
                      }

                      string zip =
                          Path.Combine(
                              Path.GetTempPath(),
                              "Launcher-Le-Eaglercraft-payload.zip"
                          );

                      using (
                          FileStream file =
                              File.Create(zip)
                      )
                      {
                          stream.CopyTo(file);
                      }

                      ZipFile.ExtractToDirectory(
                          zip,
                          root,
                          true
                      );

                      try
                      {
                          File.Delete(zip);
                      }
                      catch
                      {
                      }
                  }
              }
          }
          '@ | Set-Content "$bootstrap\Program.cs" -Encoding UTF8

      - name: Publish final EXE
        shell: pwsh
        working-directory: build/bootstrap
        run: |
          dotnet restore Launcher-Le-Eaglercraft.csproj

          dotnet publish Launcher-Le-Eaglercraft.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -o "${{ github.workspace }}\release"

      - name: Verify final EXE
        shell: pwsh
        run: |
          $exe = "${{ github.workspace }}\release\Launcher-Le-Eaglercraft.exe"

          if (!(Test-Path $exe)) {
            Write-Error "Final EXE was not created."
            Get-ChildItem "${{ github.workspace }}\release" -Force
            exit 1
          }

          $size = (Get-Item $exe).Length

          Write-Host "Final EXE:"
          Write-Host $exe
          Write-Host "Size: $size bytes"

          if ($size -lt 1000000) {
            Write-Warning "The EXE is unexpectedly small."
          }

      - name: Create changelog
        shell: pwsh
        run: |
          $root = "${{ github.workspace }}"

          @'
          # Launcher Le Eaglercraft

          ## Current Build

          This release packages the Launcher Le Eaglercraft website and all 13 game repositories into one Windows x64 executable.

          ### Included repositories

          - secret-stuff
          - secret-stuff-v2
          - secret-stuff-v3
          - secret-stuff-v4
          - secret-stuff-v5
          - secret-stuff-v6
          - secret-stuff-v7
          - secret-stuff-v8
          - secret-stuff-v9
          - secret-stuff-v10
          - secret-stuff-v11
          - secret-stuff-v12
          - secret-stuff-v13

          ### Launcher mappings

          - Minecraft 26.2 → secret-stuff-v10
          - Minecraft 1.16.5 → secret-stuff-v11
          - Minecraft 1.14.4 → secret-stuff-v12
          - Minecraft 1.13.2 → secret-stuff-v13
          - Minecraft 1.12.2 → secret-stuff
          - EaglercraftX 1.8.8 → secret-stuff-v6
          - Beta 1.7.3 → secret-stuff-v4
          - Beta 1.3_01 → secret-stuff-v7
          - Alpha 1.2.6 → secret-stuff-v5
          - Indev → secret-stuff-v3
          - C0.30 → secret-stuff-v8

          ### Runtime

          The Windows launcher uses CefSharp/Chromium and serves the bundled launcher through a local HTTP server.

          The final release contains one EXE asset.
          '@ | Set-Content "$root\CHANGELOG.md" -Encoding UTF8

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "build-${{ github.run_number }}"
          name: "Launcher Le Eaglercraft Build ${{ github.run_number }}"
