name: Build Launcher

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout launcher repository
        uses: actions/checkout@v4
        with:
          path: launcher-repo

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Create build directories
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "build"
          New-Item -ItemType Directory -Force -Path "build\launcher"
          New-Item -ItemType Directory -Force -Path "build\games"

      - name: Copy existing launcher
        shell: cmd
        run: |
          robocopy "launcher-repo\launcher" "build\launcher" /E /XD ".git" ".github" /XF ".gitignore"
          if %ERRORLEVEL% LEQ 7 exit /b 0
          exit /b %ERRORLEVEL%

      # ------------------------------------------------------------
      # DOWNLOAD ALL 13 PUBLIC GAME REPOSITORIES
      # ------------------------------------------------------------

      - name: Download secret-stuff
        shell: pwsh
        run: |
          git clone --depth 1 "https://github.com/Vexo-Sirramenboi/secret-stuff.git" "build\games\secret-stuff"

      - name: Download secret-stuff-v2
        shell: pwsh
        run: |
          git clone --depth 1 "https://github.com/Vexo-Sirramenboi/secret-stuff-v2.git" "build\games\secret-stuff-v2"

      - name: Download secret-stuff-v3
        shell: pwsh
        run: |
          git clone --depth 1 "https://github.com/Vexo-Sirramenboi/secret-stuff-v3.git" "build\games\secret-stuff-v3"

      - name: Download secret-stuff-v4
        shell: pwsh
        run: |
          git clone --depth 1 "https://github.com/Vexo-Sirramenboi/secret-stuff-v4.git" "build\games\secret-stuff-v4"

      - name: Download secret-stuff-v5
        shell: pwsh
        run: |
          git clone --depth 1 "https://github.com/Vexo-Sirramenboi/secret-stuff-v5.git" "build\games\secret-stuff-v5"

      - name: Download secret-stuff-v6
        shell: pwsh
        run: |
          git clone --depth 1 "https://github.com/Vexo-Sirramenboi/secret-stuff-v6.git" "build\games\secret-stuff-v6"

      - name: Download secret-stuff-v7
        shell: pwsh
        run: |
          git clone --depth 1 "https://github.com/Vexo-Sirramenboi/secret-stuff-v7.git" "build\games\secret-stuff-v7"

      - name: Download secret-stuff-v8
        shell: pwsh
        run: |
          git clone --depth 1 "https://github.com/Vexo-Sirramenboi/secret-stuff-v8.git" "build\games\secret-stuff-v8"

      - name: Download secret-stuff-v9
        shell: pwsh
        run: |
          git clone --depth 1 "https://github.com/Vexo-Sirramenboi/secret-stuff-v9.git" "build\games\secret-stuff-v9"

      - name: Download secret-stuff-v10
        shell: pwsh
        run: |
          git clone --depth 1 "https://github.com/Vexo-Sirramenboi/secret-stuff-v10.git" "build\games\secret-stuff-v10"

      - name: Download secret-stuff-v11
        shell: pwsh
        run: |
          git clone --depth 1 "https://github.com/Vexo-Sirramenboi/secret-stuff-v11.git" "build\games\secret-stuff-v11"

      - name: Download secret-stuff-v12
        shell: pwsh
        run: |
          git clone --depth 1 "https://github.com/Vexo-Sirramenboi/secret-stuff-v12.git" "build\games\secret-stuff-v12"

      - name: Download secret-stuff-v13
        shell: pwsh
        run: |
          git clone --depth 1 "https://github.com/Vexo-Sirramenboi/secret-stuff-v13.git" "build\games\secret-stuff-v13"

      # ------------------------------------------------------------
      # REMOVE GIT DATA FROM DOWNLOADED GAMES
      # ------------------------------------------------------------

      - name: Remove repository metadata
        shell: pwsh
        run: |
          Get-ChildItem "build\games" -Directory -Recurse -Force |
            Where-Object { $_.Name -eq ".git" } |
            Remove-Item -Recurse -Force -ErrorAction SilentlyContinue

      # ------------------------------------------------------------
      # FIX LAUNCHER LINKS
      # ------------------------------------------------------------

      - name: Convert launcher links to embedded games
        shell: pwsh
        run: |
          $index = "build\launcher\index.html"

          if (-not (Test-Path $index)) {
            Write-Error "build\launcher\index.html was not found."
            exit 1
          }

          $html = Get-Content $index -Raw

          $repos = @(
            "secret-stuff",
            "secret-stuff-v2",
            "secret-stuff-v3",
            "secret-stuff-v4",
            "secret-stuff-v5",
            "secret-stuff-v6",
            "secret-stuff-v7",
            "secret-stuff-v8",
            "secret-stuff-v9",
            "secret-stuff-v10",
            "secret-stuff-v11",
            "secret-stuff-v12",
            "secret-stuff-v13"
          )

          foreach ($repo in $repos) {
            $urls = @(
              "https://vexo-sirramenboi.github.io/$repo/",
              "https://Vexo-Sirramenboi.github.io/$repo/",
              "https://vexo-sirramenboi.github.io/$repo",
              "https://Vexo-Sirramenboi.github.io/$repo"
            )

            foreach ($url in $urls) {
              $html = $html.Replace(
                $url,
                "/games/$repo/"
              )
            }
          }

          Set-Content `
            -Path $index `
            -Value $html `
            -Encoding UTF8

          Write-Host "All 13 launcher URLs converted."

      # ------------------------------------------------------------
      # CREATE LOCAL WEBSITE PAYLOAD
      # ------------------------------------------------------------

      - name: Create website payload
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "desktop\www"

          Copy-Item `
            "build\launcher\*" `
            "desktop\www" `
            -Recurse `
            -Force

          New-Item -ItemType Directory -Force -Path "desktop\www\games"

          Copy-Item `
            "build\games\*" `
            "desktop\www\games" `
            -Recurse `
            -Force

      # ------------------------------------------------------------
      # BUILD CEF DESKTOP LAUNCHER
      # ------------------------------------------------------------

      - name: Restore desktop launcher
        shell: pwsh
        run: |
          dotnet restore "desktop\Launcher-Le-Eaglercraft.csproj"

      - name: Build desktop launcher
        shell: pwsh
        run: |
          dotnet publish `
            "desktop\Launcher-Le-Eaglercraft.csproj" `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=false `
            -p:DebugType=None `
            -p:DebugSymbols=false `
            -o "build\desktop"

      # ------------------------------------------------------------
      # CREATE EMBEDDED PAYLOAD
      # ------------------------------------------------------------

      - name: Create embedded launcher payload
        shell: pwsh
        run: |
          if (Test-Path "desktop\payload.zip") {
            Remove-Item "desktop\payload.zip" -Force
          }

          Compress-Archive `
            -Path "desktop\www\*" `
            -DestinationPath "desktop\payload.zip" `
            -CompressionLevel Optimal

          Write-Host "Created desktop payload."

      # ------------------------------------------------------------
      # CREATE SELF-EXTRACTING SINGLE EXE
      # ------------------------------------------------------------

      - name: Prepare bootstrap project
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "bootstrap"

          Copy-Item `
            "desktop\payload.zip" `
            "bootstrap\payload.zip" `
            -Force

          Copy-Item `
            "desktop\BootstrapProgram.cs" `
            "bootstrap\Program.cs" `
            -Force

          @"
          <Project Sdk="Microsoft.NET.Sdk">

            <PropertyGroup>
              <OutputType>WinExe</OutputType>
              <TargetFramework>net8.0-windows</TargetFramework>
              <RuntimeIdentifier>win-x64</RuntimeIdentifier>
              <SelfContained>true</SelfContained>

              <PublishSingleFile>true</PublishSingleFile>
              <IncludeNativeLibrariesForSelfExtract>true</IncludeNativeLibrariesForSelfExtract>

              <EnableCompressionInSingleFile>true</EnableCompressionInSingleFile>

              <AssemblyName>Launcher-Le-Eaglercraft</AssemblyName>
              <RootNamespace>LauncherLeEaglercraft</RootNamespace>

              <DebugType>None</DebugType>
              <DebugSymbols>false</DebugSymbols>

              <ApplicationIcon>app.ico</ApplicationIcon>
            </PropertyGroup>

            <ItemGroup>
              <EmbeddedResource Include="payload.zip">
                <LogicalName>LauncherLeEaglercraft.payload.zip</LogicalName>
              </EmbeddedResource>
            </ItemGroup>

          </Project>
          "@ | Set-Content "bootstrap\Launcher-Le-Eaglercraft.csproj"

      - name: Copy launcher icon
        shell: pwsh
        run: |
          if (Test-Path "launcher-repo\launcher\favicon.ico") {
            Copy-Item `
              "launcher-repo\launcher\favicon.ico" `
              "bootstrap\app.ico" `
              -Force
          }

      - name: Build standalone EXE
        shell: pwsh
        run: |
          dotnet publish `
            "bootstrap\Launcher-Le-Eaglercraft.csproj" `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -o "release"

      # ------------------------------------------------------------
      # VERIFY FINAL EXE
      # ------------------------------------------------------------

      - name: Verify final EXE
        shell: pwsh
        run: |
          $exe = "release\Launcher-Le-Eaglercraft.exe"

          if (-not (Test-Path $exe)) {
            Write-Error "Launcher-Le-Eaglercraft.exe was not created."
            exit 1
          }

          $size = (Get-Item $exe).Length

          Write-Host "Final EXE:"
          Write-Host $exe
          Write-Host "Size: $size bytes"

      # ------------------------------------------------------------
      # GENERATE CHANGELOG
      # ------------------------------------------------------------

      - name: Generate changelog
        shell: pwsh
        run: |
          $sha = "${{ github.sha }}"

          $date = Get-Date -Format "yyyy-MM-dd HH:mm:ss UTC"

          @"
          # Launcher Le Eaglercraft

          ## Build
          - Date: $date
          - Commit: $sha
          - Platform: Windows x64
          - Browser engine: Chromium Embedded Framework (CEF)
          - Distribution: Single standalone EXE

          ## Changes
          - Replaced WebView2 with CEF.
          - Embedded the launcher website into the desktop build.
          - Embedded all 13 game repositories.
          - Added local game paths for offline desktop launching.
          - Added self-contained launcher packaging.
          - Added automatic payload extraction at runtime.
          - Kept the existing Launcher Le interface.
          - Updated the desktop launcher build pipeline.
          - Generated this release automatically with GitHub Actions.

          ## Included Games
          - secret-stuff
          - secret-stuff-v2
          - secret-stuff-v3
          - secret-stuff-v4
          - secret-stuff-v5
          - secret-stuff-v6
          - secret-stuff-v7
          - secret-stuff-v8
          - secret-stuff-v9
          - secret-stuff-v10
          - secret-stuff-v11
          - secret-stuff-v12
          - secret-stuff-v13

          ## Notes
          The distributed release contains one EXE.
          Game files and browser runtime are packaged inside the launcher.
          "@ | Set-Content "release\CHANGELOG.md"

      # ------------------------------------------------------------
      # CREATE GITHUB RELEASE
      # ------------------------------------------------------------

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "launcher-${{ github.run_number }}"
          name: "Launcher Le Eaglercraft ${{ github.run_number }}"
          body_path: "release\CHANGELOG.md"
          files: |
            release/Launcher-Le-Eaglercraft.exe
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
