name: Build Launcher Le Eaglercraft EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows EXE
    runs-on: windows-latest

    steps:

      - name: Checkout Launcher
        uses: actions/checkout@v4
        with:
          path: launcher

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Create build directories
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path "build"
          New-Item -ItemType Directory -Force -Path "build\launcher"
          New-Item -ItemType Directory -Force -Path "build\games"
          New-Item -ItemType Directory -Force -Path "build\payload"
          New-Item -ItemType Directory -Force -Path "desktop"
          New-Item -ItemType Directory -Force -Path "dist"

      - name: Copy existing launcher
        shell: powershell
        run: |
          $source = Join-Path $PWD "launcher"
          $destination = Join-Path $PWD "build\launcher"

          Get-ChildItem -Path $source -Force |
            Where-Object {
              $_.Name -ne ".git" -and
              $_.Name -ne ".github" -and
              $_.Name -ne ".gitignore"
            } |
            Copy-Item -Destination $destination -Recurse -Force

          Write-Host ""
          Write-Host "Launcher files copied:"
          Get-ChildItem -Path $destination -Recurse -File |
            ForEach-Object {
              Write-Host $_.FullName
            }

      - name: Download secret-stuff
        uses: actions/checkout@v4
        with:
          repository: Vexo-Sirramenboi/secret-stuff
          path: build/games/secret-stuff
          fetch-depth: 1

      - name: Download secret-stuff-v2
        uses: actions/checkout@v4
        with:
          repository: Vexo-Sirramenboi/secret-stuff-v2
          path: build/games/secret-stuff-v2
          fetch-depth: 1

      - name: Download secret-stuff-v3
        uses: actions/checkout@v4
        with:
          repository: Vexo-Sirramenboi/secret-stuff-v3
          path: build/games/secret-stuff-v3
          fetch-depth: 1

      - name: Download secret-stuff-v4
        uses: actions/checkout@v4
        with:
          repository: Vexo-Sirramenboi/secret-stuff-v4
          path: build/games/secret-stuff-v4
          fetch-depth: 1

      - name: Download secret-stuff-v5
        uses: actions/checkout@v4
        with:
          repository: Vexo-Sirramenboi/secret-stuff-v5
          path: build/games/secret-stuff-v5
          fetch-depth: 1

      - name: Download secret-stuff-v6
        uses: actions/checkout@v4
        with:
          repository: Vexo-Sirramenboi/secret-stuff-v6
          path: build/games/secret-stuff-v6
          fetch-depth: 1

      - name: Download secret-stuff-v7
        uses: actions/checkout@v4
        with:
          repository: Vexo-Sirramenboi/secret-stuff-v7
          path: build/games/secret-stuff-v7
          fetch-depth: 1

      - name: Download secret-stuff-v8
        uses: actions/checkout@v4
        with:
          repository: Vexo-Sirramenboi/secret-stuff-v8
          path: build/games/secret-stuff-v8
          fetch-depth: 1

      - name: Download secret-stuff-v9
        uses: actions/checkout@v4
        with:
          repository: Vexo-Sirramenboi/secret-stuff-v9
          path: build/games/secret-stuff-v9
          fetch-depth: 1

      - name: Download secret-stuff-v10
        uses: actions/checkout@v4
        with:
          repository: Vexo-Sirramenboi/secret-stuff-v10
          path: build/games/secret-stuff-v10
          fetch-depth: 1

      - name: Download secret-stuff-v11
        uses: actions/checkout@v4
        with:
          repository: Vexo-Sirramenboi/secret-stuff-v11
          path: build/games/secret-stuff-v11
          fetch-depth: 1

      - name: Download secret-stuff-v12
        uses: actions/checkout@v4
        with:
          repository: Vexo-Sirramenboi/secret-stuff-v12
          path: build/games/secret-stuff-v12
          fetch-depth: 1

      - name: Download secret-stuff-v13
        uses: actions/checkout@v4
        with:
          repository: Vexo-Sirramenboi/secret-stuff-v13
          path: build/games/secret-stuff-v13
          fetch-depth: 1

      - name: Remove Git metadata
        shell: powershell
        run: |
          Get-ChildItem "build\games" -Directory -Recurse -Force |
            Where-Object {
              $_.Name -eq ".git"
            } |
            Remove-Item -Recurse -Force

      - name: Verify game repositories
        shell: powershell
        run: |
          $repos = @(
            "secret-stuff",
            "secret-stuff-v2",
            "secret-stuff-v3",
            "secret-stuff-v4",
            "secret-stuff-v5",
            "secret-stuff-v6",
            "secret-stuff-v7",
            "secret-stuff-v8",
            "secret-stuff-v9",
            "secret-stuff-v10",
            "secret-stuff-v11",
            "secret-stuff-v12",
            "secret-stuff-v13"
          )

          foreach ($repo in $repos) {
            $path = "build\games\$repo"

            if (-not (Test-Path $path)) {
              Write-Error "Missing repository: $repo"
              exit 1
            }

            Write-Host "OK: $repo"
          }

          Write-Host ""
          Write-Host "All 13 repositories downloaded successfully."

      - name: Prepare desktop launcher
        shell: powershell
        run: |
          $index = "build\launcher\index.html"

          if (-not (Test-Path $index)) {
            Write-Error "index.html was not found."
            exit 1
          }

          $html = Get-Content $index -Raw

          $base = "https://vexo-sirramenboi.github.io"

          $repos = @(
            "secret-stuff",
            "secret-stuff-v2",
            "secret-stuff-v3",
            "secret-stuff-v4",
            "secret-stuff-v5",
            "secret-stuff-v6",
            "secret-stuff-v7",
            "secret-stuff-v8",
            "secret-stuff-v9",
            "secret-stuff-v10",
            "secret-stuff-v11",
            "secret-stuff-v12",
            "secret-stuff-v13"
          )

          foreach ($repo in $repos) {
            $remoteWithSlash = "$base/$repo/"
            $remoteWithoutSlash = "$base/$repo"
            $local = "/games/$repo/"

            $html = $html.Replace(
              $remoteWithSlash,
              $local
            )

            $html = $html.Replace(
              $remoteWithoutSlash,
              $local
            )

            Write-Host "Prepared: $repo"
          }

          Set-Content `
            -Path $index `
            -Value $html `
            -Encoding UTF8

      - name: Create desktop payload
        shell: powershell
        run: |
          Get-ChildItem `
            -Path "build\launcher" `
            -Force |
            Copy-Item `
              -Destination "build\payload" `
              -Recurse `
              -Force

          New-Item `
            -ItemType Directory `
            -Force `
            -Path "build\payload\games" |
            Out-Null

          Get-ChildItem `
            -Path "build\games" `
            -Force |
            Copy-Item `
              -Destination "build\payload\games" `
              -Recurse `
              -Force

          if (-not (Test-Path "build\payload\index.html")) {
            Write-Error "index.html is missing from payload."
            exit 1
          }

          if (-not (Test-Path "build\payload\games")) {
            Write-Error "games directory is missing."
            exit 1
          }

          Write-Host "Payload ready."

      - name: Create desktop project
        shell: powershell
        run: |
          @'
          <Project Sdk="Microsoft.NET.Sdk">

            <PropertyGroup>
              <OutputType>WinExe</OutputType>
              <TargetFramework>net10.0-windows</TargetFramework>
              <UseWindowsForms>true</UseWindowsForms>

              <RuntimeIdentifier>win-x64</RuntimeIdentifier>
              <SelfContained>true</SelfContained>

              <PublishSingleFile>true</PublishSingleFile>
              <IncludeNativeLibrariesForSelfExtract>true</IncludeNativeLibrariesForSelfExtract>

              <AssemblyName>Launcher-Le-Eaglercraft</AssemblyName>
              <RootNamespace>LauncherLeEaglercraft</RootNamespace>
            </PropertyGroup>

            <ItemGroup>
              <PackageReference
                Include="Microsoft.Web.WebView2"
                Version="1.0.3485.11" />

              <EmbeddedResource
                Include="launcher.zip" />
            </ItemGroup>

          </Project>
          '@ | Set-Content `
            "desktop\Launcher-Le-Eaglercraft.csproj"

      - name: Create internal launcher package
        shell: powershell
        run: |
          Compress-Archive `
            -Path "build\payload\*" `
            -DestinationPath "desktop\launcher.zip" `
            -CompressionLevel Optimal

          if (-not (Test-Path "desktop\launcher.zip")) {
            Write-Error "Internal launcher package was not created."
            exit 1
          }

          Write-Host "Internal launcher package created."

      - name: Create desktop launcher source
        shell: powershell
        run: |
          @'
          using System;
          using System.IO;
          using System.IO.Compression;
          using System.Reflection;
          using System.Threading.Tasks;
          using System.Windows.Forms;
          using Microsoft.Web.WebView2.Core;
          using Microsoft.Web.WebView2.WinForms;

          namespace LauncherLeEaglercraft
          {
              internal static class Program
              {
                  [STAThread]
                  static void Main()
                  {
                      ApplicationConfiguration.Initialize();

                      string appDirectory =
                          Path.Combine(
                              Environment.GetFolderPath(
                                  Environment.SpecialFolder.LocalApplicationData
                              ),
                              "Launcher Le Eaglercraft"
                          );

                      string launcherDirectory =
                          Path.Combine(
                              appDirectory,
                              "launcher"
                          );

                      Directory.CreateDirectory(
                          appDirectory
                      );

                      try
                      {
                          ExtractLauncher(
                              launcherDirectory
                          );

                          Application.Run(
                              new LauncherForm(
                                  launcherDirectory
                              )
                          );
                      }
                      catch (Exception ex)
                      {
                          MessageBox.Show(
                              ex.ToString(),
                              "Launcher Le Eaglercraft",
                              MessageBoxButtons.OK,
                              MessageBoxIcon.Error
                          );
                      }
                  }

                  static void ExtractLauncher(
                      string destination
                  )
                  {
                      Assembly assembly =
                          Assembly.GetExecutingAssembly();

                      using Stream? resource =
                          assembly.GetManifestResourceStream(
                              "LauncherLeEaglercraft.launcher.zip"
                          );

                      if (resource == null)
                      {
                          throw new Exception(
                              "Embedded launcher resources were not found."
                          );
                      }

                      string temporaryZip =
                          Path.Combine(
                              Path.GetTempPath(),
                              "launcher-le-eaglercraft.zip"
                          );

                      using (
                          FileStream output =
                              new FileStream(
                                  temporaryZip,
                                  FileMode.Create,
                                  FileAccess.Write
                              )
                      )
                      {
                          resource.CopyTo(output);
                      }

                      if (Directory.Exists(destination))
                      {
                          Directory.Delete(
                              destination,
                              true
                          );
                      }

                      Directory.CreateDirectory(
                          destination
                      );

                      ZipFile.ExtractToDirectory(
                          temporaryZip,
                          destination
                      );

                      File.Delete(
                          temporaryZip
                      );
                  }
              }

              public sealed class LauncherForm : Form
              {
                  private readonly WebView2 webView;

                  public LauncherForm(
                      string launcherDirectory
                  )
                  {
                      Text =
                          "Launcher Le Eaglercraft";

                      Width = 1280;
                      Height = 800;

                      MinimumSize =
                          new System.Drawing.Size(
                              900,
                              600
                          );

                      StartPosition =
                          FormStartPosition.CenterScreen;

                      webView =
                          new WebView2
                          {
                              Dock = DockStyle.Fill
                          };

                      Controls.Add(
                          webView
                      );

                      Load += async (_, _) =>
                      {
                          await InitializeBrowser(
                              launcherDirectory
                          );
                      };
                  }

                  private async Task InitializeBrowser(
                      string launcherDirectory
                  )
                  {
                      await webView.EnsureCoreWebView2Async();

                      webView.CoreWebView2
                          .SetVirtualHostNameToFolderMapping(
                              "launcher.local",
                              launcherDirectory,
                              CoreWebView2HostResourceAccessKind.Allow
                          );

                      webView.CoreWebView2.Navigate(
                          "https://launcher.local/index.html"
                      );
                  }
              }
          }
          '@ | Set-Content `
            "desktop\Program.cs"

      - name: Build single-file EXE
        shell: powershell
        run: |
          dotnet publish `
            "desktop\Launcher-Le-Eaglercraft.csproj" `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            --output "dist"

      - name: Verify EXE
        shell: powershell
        run: |
          $exe = "dist\Launcher-Le-Eaglercraft.exe"

          if (-not (Test-Path $exe)) {
            Write-Error "Launcher-Le-Eaglercraft.exe was not created."
            exit 1
          }

          $file = Get-Item $exe

          Write-Host ""
          Write-Host "============================================"
          Write-Host " BUILD SUCCESSFUL"
          Write-Host "============================================"
          Write-Host "File: $($file.Name)"
          Write-Host "Size: $($file.Length) bytes"
          Write-Host "============================================"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: launcher-${{ github.run_number }}
          name: Launcher Le Eaglercraft ${{ github.run_number }}
          generate_release_notes: true
          files: |
            dist/Launcher-Le-Eaglercraft.exe
